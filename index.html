<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💱 Conversor de Moedas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>💱 Conversor de Moedas</h1>
    <p class="subtitle">Cotação em tempo real via AwesomeAPI</p>

    <form id="converter-form">
      <label for="valor">Valor em Real (BRL)</label>
      <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 100.00" required />

      <label for="moeda-destino">Converter para</label>
      <select id="moeda-destino">
        <option value="USD">Dólar (USD)</option>
        <option value="EUR">Euro (EUR)</option>
        <option value="GBP">Libra Esterlina (GBP)</option>
        <option value="ARS">Peso Argentino (ARS)</option>
      </select>

      <button type="submit">Converter</button>
    </form>

    <div id="resultado" class="resultado" aria-live="polite"></div>
    <div id="status" class="status"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
